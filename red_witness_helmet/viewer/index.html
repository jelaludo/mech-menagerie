<style>
/* layout: one full-bleed WebGL stage; the HUD is three small corner labels floating over it */
:root {
  color-scheme: dark;
  --bg: #0c0e11;            /* stage, edge of frame */
  --bg-glow: #232830;       /* stage, behind the helmet */
  --fg: #dfe3e8;
  --dim: #808a96;
  --line: rgba(223, 227, 232, 0.18);
  --panel: rgba(12, 14, 17, 0.55);
  --accent: #ff4d38;        /* the optics' sensor red */
  --hazard: #f2a31c;        /* filter-housing stripe orange */
  --font-display: "Saira Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-mono); font-size: 12px; overflow: hidden; }
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

.hud {
  position: fixed; inset: 0; pointer-events: none; display: grid;
  grid-template: "name hint" auto ". ." 1fr "read ctrl" auto / 1fr auto;
  gap: 12px;
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: opacity 0.35s ease;
}
.hud.off { opacity: 0; }
.hud.off * { pointer-events: none !important; }
.name { grid-area: name; font-family: var(--font-display); line-height: 1; }
.name b { display: block; font-weight: 600; font-size: 22px; letter-spacing: 0.14em; }
.name b i { font-style: normal; color: var(--accent); }
.name span { display: block; margin-top: 5px; font-weight: 500; font-size: 12px; letter-spacing: 0.3em; color: var(--dim); }
.hint { grid-area: hint; align-self: start; text-align: right; color: var(--dim); font-size: 11px; line-height: 1.6;
  transition: opacity 1.2s ease; }
.hint.fade { opacity: 0; }
.read { grid-area: read; align-self: end; min-width: 0; font-variant-numeric: tabular-nums; line-height: 1.7; }
.read .big { font-family: var(--font-display); font-weight: 600; font-size: 30px; letter-spacing: 0.06em; line-height: 1; }
.read .big small { font-size: 13px; letter-spacing: 0.22em; color: var(--dim); margin-left: 6px; }
.read .sub { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ctrl { grid-area: ctrl; align-self: end; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; pointer-events: auto; }
.seg { display: flex; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(6px); }
.seg button { all: unset; box-sizing: border-box; min-width: 34px; height: 30px; padding: 0 10px; text-align: center;
  font: 500 11px/30px var(--font-mono); letter-spacing: 0.08em; color: var(--dim); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { color: var(--fg); }
.seg button[aria-pressed="true"] { color: var(--bg); background: var(--fg); }
.seg.lod button[aria-pressed="true"] { background: var(--accent); color: #140402; }
.seg button:focus-visible { outline: 2px solid var(--hazard); outline-offset: 2px; }
.seg .tag { padding: 0 9px; font: 500 10px/30px var(--font-mono); letter-spacing: 0.18em; color: var(--dim); border-right: 1px solid var(--line); }
#load { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center;
  font: 500 11px/1.8 var(--font-mono); letter-spacing: 0.24em; color: var(--dim); transition: opacity 0.6s ease;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#load.done { opacity: 0; }
#load b { display: block; color: var(--fg); font-family: var(--font-display); font-size: 18px; letter-spacing: 0.3em; font-weight: 600; }
@media (max-width: 520px) {
  .hud { grid-template: "name" auto "." 1fr "read" auto "ctrl" auto / 1fr; }
  .hint { display: none; }
  .ctrl { justify-content: flex-start; }
  .read .big { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { .hud, .hint, #load { transition: none; } }
</style>

<canvas id="stage" tabindex="0" aria-label="Interactive 3D view of the Red Witness helmet"></canvas>
<div id="load"><div><b>RED WITNESS</b><span id="loadmsg">LOADING ASSET</span></div></div>

  <div class="name"><b>RED <i>/</i> WITNESS</b><span>HELMET · GAME ASSET</span><br><a href="../../" style="display:inline-block;margin-top:10px;pointer-events:auto;color:var(--dim);text-decoration:none;font:500 11px/1 var(--font-mono);letter-spacing:0.16em">‹ ALL MODELS</a><a href="../../terms.html" style="display:inline-block;margin-top:10px;pointer-events:auto;color:var(--dim);text-decoration:none;font:500 11px/1 var(--font-mono);letter-spacing:0.16em;margin-left:16px">© JELALUDO · TERMS</a></div>

    </div>
    <div class="seg" role="group" aria-label="View options">
      <button id="wire" aria-pressed="false">WIRE</button><button id="spin" aria-pressed="true">SPIN</button><button id="glow" aria-pressed="true">GLOW</button>
    </div>

<script type="importmap">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const ASSETS = "assets/";
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const canvas = $("stage");

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;

const scene = new THREE.Scene();
// backdrop: a soft pool of light behind the helmet, falling off to the frame edge
{
  const c = document.createElement("canvas");
  c.width = c.height = 512;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(256, 236, 10, 256, 256, 380);
  grad.addColorStop(0, css("--bg-glow"));
  grad.addColorStop(1, css("--bg"));
  g.fillStyle = grad;
  g.fillRect(0, 0, 512, 512);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const key = new THREE.DirectionalLight(0xfff1e2, 1.9);
key.position.set(0.9, 1.3, 1.4);
const rim = new THREE.DirectionalLight(0x9fc4ff, 1.3);
rim.position.set(-1.2, 0.9, -1.3);
scene.add(key, rim);

const CENTER = new THREE.Vector3(0, 0.168, 0);
const camera = new THREE.PerspectiveCamera(30, 1, 0.02, 20);
camera.position.set(0.36, 0.24, 0.88);
const controls = new OrbitControls(camera, canvas);
controls.target.copy(CENTER);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 0.3;
controls.maxDistance = 3.2;
controls.autoRotate = !reduced;
controls.autoRotateSpeed = 0.7;
controls.update();

// contact shadow under the neck ring
{
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const g = c.getContext("2d");
  const grad = g.createRadialGradient(128, 128, 20, 128, 128, 128);
  grad.addColorStop(0, "rgba(0,0,0,0.6)");
  grad.addColorStop(1, "rgba(0,0,0,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 256, 256);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(0.62, 0.62),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
  m.rotation.x = -Math.PI / 2;
  m.position.y = -0.001;
  scene.add(m);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.42, 0.55, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function resize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.fov = w < h ? 40 : 30;      // keep the helmet framed on portrait screens
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

// ---- asset ----
const texLoader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function tex(name, srgb, res) {
  const file = "RedWitness_" + name + "_" + res + ".jpg";
  return new Promise((ok, fail) => texLoader.load(ASSETS + file, (t) => {
    t.flipY = false;
    t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
    t.anisotropy = maxAniso;
    ok(t);
  }, undefined, () => fail(new Error("texture " + file))));
}
// geometry ships as JSON (base64 typed arrays, glTF conventions: +Y up, V down, MikkTSpace tangents)
function bytes(b64) {
  const bin = atob(b64), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
const loadMesh = (i) => fetch(ASSETS + "RedWitnessHelmet_LOD" + i + ".json").then((r) => {
  if (!r.ok) throw new Error("mesh LOD" + i);
  return r.json();
}).then((d) => {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(bytes(d.position)), 3));
  g.setAttribute("normal", new THREE.BufferAttribute(new Float32Array(bytes(d.normal)), 3));
  g.setAttribute("uv", new THREE.BufferAttribute(new Float32Array(bytes(d.uv)), 2));
  g.setAttribute("tangent", new THREE.BufferAttribute(new Float32Array(bytes(d.tangent)), 4));
  const idx = bytes(d.index);
  g.setIndex(new THREE.BufferAttribute(d.indexBytes === 4 ? new Uint32Array(idx) : new Uint16Array(idx), 1));
  return new THREE.Mesh(g);
});

const lods = [];
let current = 0, wireOn = false, wireOnly = false, stats = null, texRes = "2K";
const loadSet = (res) => Promise.all([tex("BaseColor", true, res), tex("Normal", false, res), tex("ORM", false, res),
  tex("Emissive", true, res)]);

function show(i) {
  current = i;
  lods.forEach((l, k) => { l.mesh.visible = k === i && !wireOnly; l.wire.visible = k === i && wireOn; l.wire.material.opacity = wireOnly ? 0.5 : 0.55; });
  bloom.enabled = !wireOnly && $("glow").getAttribute("aria-pressed") === "true";   // glow would fill the lines in
  scene.children.forEach((o) => { if (o.isMesh) o.visible = !wireOnly; });   // floor and shadow
  for (let k = 0; k < 4; k++) $("lod" + k).setAttribute("aria-pressed", String(k === i));
  const n = lods[i].tris;
  $("tris").textContent = n.toLocaleString("en-US");
  $("sub").textContent = "LOD" + i + " · " + Math.round(100 * n / lods[0].tris) + "% of LOD0 · one material · " + texRes + " textures";
}

async function start() {
  try {
    const [[base, normal, orm, emissive], st, ...meshes] = await Promise.all([
      loadSet("2k"), fetch(ASSETS + "stats.json").then((r) => r.json()).catch(() => null),
      loadMesh(2), loadMesh(2), loadMesh(2), loadMesh(3)]);   // public copy: no LOD0 or LOD1; slots 0 and 1 hold LOD2, their buttons hidden
    stats = st;
    const mat = new THREE.MeshStandardMaterial({
      map: base, normalMap: normal, aoMap: orm, roughnessMap: orm, metalnessMap: orm, roughness: 1, metalness: 1,
      emissiveMap: emissive, emissive: 0xffffff, emissiveIntensity: 3.2, envMapIntensity: 0.5 });
    const wireMat = new THREE.LineBasicMaterial({ color: css("--hazard"), transparent: true, opacity: 0.55 });
    meshes.forEach((m, i) => {
      m.material = mat;
      if (!m.geometry.attributes.tangent) mat.normalScale.set(1, -1);
      const group = new THREE.Group();
      group.add(m);
      const wire = new THREE.LineSegments(new THREE.WireframeGeometry(m.geometry), wireMat);
      wire.position.copy(m.position); wire.quaternion.copy(m.quaternion); wire.scale.copy(m.scale);
      group.add(wire);
      scene.add(group);
      const idx = m.geometry.index;
      const tris = (stats && stats["LOD" + i]) ? stats["LOD" + i].triangles : (idx ? idx.count : m.geometry.attributes.position.count) / 3;
      lods.push({ mesh: m, wire, tris });
    });
    show(2);
    $("load").classList.add("done");
    // desktop-class screens get the full 4K set once the first frame is up
    if (false) {   // public copy: the 4K textures are not published
      loadSet("4k").then(([b, n, o, e]) => {
        const old = [mat.map, mat.normalMap, mat.aoMap, mat.emissiveMap];
        mat.map = b; mat.normalMap = n; mat.aoMap = mat.roughnessMap = mat.metalnessMap = o; mat.emissiveMap = e;
        mat.needsUpdate = true;
        old.forEach((t) => t.dispose());
        texRes = "4K";
        show(current);
      }).catch(() => {});
    }
    setTimeout(() => $("hint").classList.add("fade"), 9000);
  } catch (err) {
    $("loadmsg").textContent = "COULD NOT LOAD THE " + String(err.message || err).toUpperCase() + " · SERVE THIS FOLDER OVER HTTP";
  }
}
start();

// ---- HUD ----
function setToggle(id, on) { $(id).setAttribute("aria-pressed", String(on)); }
function toggleWire() {                                              // off -> drawn over the model -> the wireframe alone -> off
  if (!wireOn) wireOn = true; else if (!wireOnly) wireOnly = true; else wireOn = wireOnly = false;
  setToggle("wire", wireOn);
  $("wire").textContent = wireOnly ? "WIRE ONLY" : "WIRE";
  if (lods.length) show(current);
}
function toggleSpin() { controls.autoRotate = !controls.autoRotate; setToggle("spin", controls.autoRotate); }
function toggleGlow() { bloom.enabled = !bloom.enabled; setToggle("glow", bloom.enabled); }
for (let k = 0; k < 4; k++) $("lod" + k).addEventListener("click", () => lods.length && show(k));
$("wire").addEventListener("click", toggleWire);
$("spin").addEventListener("click", toggleSpin);
$("glow").addEventListener("click", toggleGlow);
setToggle("spin", controls.autoRotate);
addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k >= "3" && k <= "4" && lods.length) show(Number(k) - 1);
  else if (k === "w") toggleWire();
  else if (k === "r") toggleSpin();
  else if (k === "g") toggleGlow();
  else if (k === "h") $("hud").classList.toggle("off");
  else if (k === "f") { const p = document.documentElement.requestFullscreen?.(); if (p && p.catch) p.catch(() => {}); }
});
canvas.addEventListener("pointerdown", () => $("hint").classList.add("fade"), { once: true });

renderer.setAnimationLoop(() => {
  controls.update();
  composer.render();
});
</script>
